# Interface specification for inedges (created 2026-10-30, batch N4, new spec; approved 2026-10-30 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: inedges
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Return the indices of the edges entering a node of a digraph and, as a second output, their source
  nodes.
invocation_forms:
- signature: eid = inedges(G, node)
  description: Incoming edge indices.
  status: confirmed
- signature: '[eid, nid] = inedges(G, node)'
  description: Also the source nodes (COBRA form).
  status: confirmed
inputs:
- name: G
  position: 1
  required: true
  description: digraph.
  status: confirmed
- name: node
  position: 2
  required: true
  description: One node, as index or name.
  status: confirmed
outputs:
- name: eid
  description: Column of edge indices (double).
  status: confirmed
- name: nid
  description: Column of source node indices, or a cellstr column of names for named nodes.
  status: confirmed
output_type_rules: []
output_shape_rules:
- id: inedges.outputs-rule
  statement: For edges 1->3, 2->3, 3->4, inedges(G, 3) gave eid [1;2] and nid [1;2].
  status: confirmed
  normative: true
  provenance: inedges.outputs
  observations:
  - file: observations/inedges_observations.json
    case_id: one-out
  - file: observations/inedges_observations.json
    case_id: two-out
- id: inedges.order-rule
  statement: For edges added as 4->2, 1->2, 3->2, the result was eid [1;2;3] and nid [1;3;4] (the edge
    table itself was not recorded).
  status: confirmed
  normative: true
  provenance: inedges.order
  observations:
  - file: observations/inedges_observations.json
    case_id: order
- id: inedges.none-rule
  statement: A node with no in-edges gives 0x1 double eid and 0x1 nid.
  status: confirmed
  normative: true
  provenance: inedges.none
  observations:
  - file: observations/inedges_observations.json
    case_id: none
- id: inedges.names-rule
  statement: With named nodes nid is a 2x1 cell of names ({'a';'b'}) and eid a 2x1 double.
  status: confirmed
  normative: true
  provenance: inedges.names
  observations:
  - file: observations/inedges_observations.json
    case_id: names
- id: inedges.selfloop-rule
  statement: A self-loop counts as an in-edge (node 1 with edges 1->1 and 2->1 gave eid [1;2], nid [1;2]).
  status: confirmed
  normative: true
  provenance: inedges.selfloop
  observations:
  - file: observations/inedges_observations.json
    case_id: selfloop
numerical_edge_cases: []
warnings: []
errors:
- condition: G is an undirected graph (called with two outputs).
  identifier: MATLAB:graphfun:graph:NoInEdgesUndir
  status: confirmed
  provenance: inedges.error-undirected
  observations:
  - file: observations/inedges_observations.json
    case_id: err-undirected
- condition: The node index is out of range.
  identifier: MATLAB:graphfun:digraph:InvalidNodeID
  status: confirmed
  provenance: inedges.error-node-range
  observations:
  - file: observations/inedges_observations.json
    case_id: err-node-range
- condition: More than one node is given.
  identifier: MATLAB:graphfun:graphbuiltin:InvalidNodeScalar
  status: confirmed
  provenance: inedges.error-two-nodes
  observations:
  - file: observations/inedges_observations.json
    case_id: err-two-nodes
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/inedges_observations.json
  description: 9 independently constructed cases on R2026a (GLNXA64), 2026-10-30.
provenance_ref: provenance.yaml
unresolved_questions:
- id: inedges.q-warning-coverage
  question: Warnings were not captured except where a case reports a lastwarn identifier; an empty warnings
    list is not a complete statement.
