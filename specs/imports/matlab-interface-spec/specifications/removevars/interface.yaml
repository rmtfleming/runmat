# Interface specification for removevars (promoted; observed behaviour confirmed).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: removevars
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: 'Return a table with the specified variables removed.

  '
invocation_forms:
- signature: T2 = removevars(T, vars)
  description: Remove the named variable(s) from table T.
  status: confirmed
inputs:
- name: T
  required: true
  description: Table.
  status: pending
- name: vars
  required: true
  description: Variable name(s) or index(es) to remove.
  status: pending
outputs:
- name: T2
  description: Table without the removed variables.
  status: pending
  type_rule:
    id: removevars.out-type
    statement: The first output has class table (observed).
    status: confirmed
    normative: true
    provenance: removevars.output-class
    observations:
    - file: observations/removevars_observations.json
      case_id: by-name
output_type_rules:
- id: removevars.output-class-rule
  statement: The output class is table across the observed inputs.
  status: confirmed
  normative: true
  provenance: removevars.output-class
  observations:
  - file: observations/removevars_observations.json
    case_id: by-name
output_shape_rules:
- id: removevars.removes-variable-rule
  statement: Returns a table with the named variable removed (removing one of three variables left a two-variable
    table); the row count is preserved.
  status: confirmed
  normative: true
  provenance: removevars.removes-variable
  observations:
  - file: observations/removevars_observations.json
    case_id: by-name
numerical_edge_cases: []
warnings: []
errors: []
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/removevars_observations.json
  description: 1 independently constructed cases on R2026a (GLNXA64).
provenance_ref: provenance.yaml
unresolved_questions:
- id: removevars.q-index
  question: Removal by numeric index or logical mask.
- id: removevars.q-multiple
  question: Removing multiple variables at once.
