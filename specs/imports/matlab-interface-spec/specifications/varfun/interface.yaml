# Interface specification for varfun (created 2026-10-30, batch N4, new spec; approved 2026-10-30 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: varfun
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Apply a function to each variable of a table and return a table of the results with variables
  named <function>_<variable>.
invocation_forms:
- signature: R = varfun(func, T)
  description: Apply func to each variable of T (COBRA form, e.g. varfun(@mean, T)).
  status: confirmed
inputs:
- name: func
  position: 1
  required: true
  description: Function handle.
  status: confirmed
- name: T
  position: 2
  required: true
  description: table.
  status: confirmed
outputs:
- name: R
  description: table with one variable per variable of T.
  status: confirmed
output_type_rules: []
output_shape_rules:
- id: varfun.names-rule
  statement: Output variables are named <function name>_<variable name> (mean_x, std_y, cumsum_x, max_v);
    an anonymous function gives Fun_<variable>.
  status: confirmed
  normative: true
  provenance: varfun.names
  observations:
  - file: observations/varfun_observations.json
    case_id: mean
  - file: observations/varfun_observations.json
    case_id: std
  - file: observations/varfun_observations.json
    case_id: elementwise
  - file: observations/varfun_observations.json
    case_id: one-var
  - file: observations/varfun_observations.json
    case_id: anonymous
- id: varfun.rows-rule
  statement: A scalar-valued function gives a one-row table (mean of [1;2;3] and [4;6;8] gave 2 and 6;
    std gave 1 and 2); a function returning a column gives that many rows (cumsum, v*2 gave 3 rows).
  status: confirmed
  normative: true
  provenance: varfun.rows
  observations:
  - file: observations/varfun_observations.json
    case_id: mean
  - file: observations/varfun_observations.json
    case_id: std
  - file: observations/varfun_observations.json
    case_id: elementwise
  - file: observations/varfun_observations.json
    case_id: anonymous
- id: varfun.cobra-pattern-rule
  statement: table2array(varfun(@mean, T))' gave the column [2;6]; varfun on T([1 3], 2:end) gave mean_y
    = 6.
  status: confirmed
  normative: true
  provenance: varfun.cobra-pattern
  observations:
  - file: observations/varfun_observations.json
    case_id: table2array
  - file: observations/varfun_observations.json
    case_id: subset
- id: varfun.rownames-rule
  statement: For a table with row names and a scalar-valued function the result had one row with variable
    mean_x (row names of the result were not recorded).
  status: confirmed
  normative: true
  provenance: varfun.rownames
  observations:
  - file: observations/varfun_observations.json
    case_id: rownames
- id: varfun.empty-rows-rule
  statement: A zero-row table with @sum gave a one-row result sum_x = 0.
  status: confirmed
  normative: true
  provenance: varfun.empty-rows
  observations:
  - file: observations/varfun_observations.json
    case_id: empty-rows
numerical_edge_cases:
- id: varfun.non-table-rule
  statement: 'Observed: a numeric matrix input errored with MATLAB:UndefinedFunction (dispatch level;
    not required).'
  status: confirmed
  normative: false
  provenance: varfun.non-table
  observations:
  - file: observations/varfun_observations.json
    case_id: err-not-table
warnings: []
errors:
- condition: func fails on a variable (here @mean on a cellstr variable).
  identifier: MATLAB:table:varfun:FunFailed
  status: confirmed
  provenance: varfun.error-cellstr
  observations:
  - file: observations/varfun_observations.json
    case_id: err-cellstr
- condition: The first argument is numeric (varfun(5, T) observed).
  identifier: MATLAB:table:varfun:InvalidFunction
  status: confirmed
  provenance: varfun.error-not-function
  observations:
  - file: observations/varfun_observations.json
    case_id: err-not-function
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/varfun_observations.json
  description: 12 independently constructed cases on R2026a (GLNXA64), 2026-10-30.
provenance_ref: provenance.yaml
unresolved_questions:
- id: varfun.q-warning-coverage
  question: Warnings were not captured except where a case reports a lastwarn identifier; an empty warnings
    list is not a complete statement.
- id: varfun.q-more-args
  question: Calls with more than two arguments were not exercised; COBRA uses only the two-argument form.
