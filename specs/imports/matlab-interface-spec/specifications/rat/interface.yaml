# Interface specification for rat (created 2026-10-30, batch N5, new spec; approved 2026-10-30 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: rat
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Return a rational approximation N./D of each element, or, with one output, a char matrix of text
  expansions.
invocation_forms:
- signature: '[N, D] = rat(X)'
  description: Numerators and denominators, elementwise (COBRA form, D used).
  status: confirmed
- signature: '[N, D] = rat(X, tol)'
  description: With a tolerance.
  status: confirmed
- signature: s = rat(X)
  description: Char expansion, one row per element.
  status: confirmed
inputs:
- name: X
  position: 1
  required: true
  description: Floating-point array.
  status: confirmed
- name: tol
  position: 2
  required: false
  description: Second argument; for pi, 1e-2 gave a coarser approximation (22/7) than the default (355/113).
  status: confirmed
outputs:
- name: N
  description: Numerators, the size and class of X.
  status: confirmed
- name: D
  description: Denominators, the size and class of X.
  status: confirmed
output_type_rules: []
output_shape_rules:
- id: rat.simple-rule
  statement: 0.75 gave 3/4, 1/3 gave 1/3, -0.5 gave -1/2 (the sign is on N and D is positive), 5 gave
    5/1 and 0 gave 0/1.
  status: confirmed
  normative: true
  provenance: rat.simple
  observations:
  - file: observations/rat_observations.json
    case_id: quarter
  - file: observations/rat_observations.json
    case_id: third
  - file: observations/rat_observations.json
    case_id: negative
  - file: observations/rat_observations.json
    case_id: integer
  - file: observations/rat_observations.json
    case_id: zero
- id: rat.default-tol-rule
  statement: pi gave 355/113 with the default tolerance (error about 2.7e-7), and 0.6667 gave 6667/10000.
  status: confirmed
  normative: true
  provenance: rat.default-tol
  observations:
  - file: observations/rat_observations.json
    case_id: pi-default
  - file: observations/rat_observations.json
    case_id: coeff-like
- id: rat.tol-rule
  statement: pi with tol = 1e-2 gave 22/7.
  status: confirmed
  normative: true
  provenance: rat.tol
  observations:
  - file: observations/rat_observations.json
    case_id: pi-tol
- id: rat.elementwise-rule
  statement: Arrays are handled elementwise with the input shape ([0.5 0.25; 1.5 2] gave N = [1 1; 3 2],
    D = [2 4; 2 1]); an empty input gave empty outputs.
  status: confirmed
  normative: true
  provenance: rat.elementwise
  observations:
  - file: observations/rat_observations.json
    case_id: matrix
  - file: observations/rat_observations.json
    case_id: empty
- id: rat.class-rule
  statement: N and D are double for double input and single for single input.
  status: confirmed
  normative: true
  provenance: rat.class
  observations:
  - file: observations/rat_observations.json
    case_id: quarter
  - file: observations/rat_observations.json
    case_id: single
- id: rat.text-rule
  statement: 'For real input, one output gives a char row per element: ''1 + 1/(-4)'' for 0.75, and a
    2x10 char matrix for [0.5 1.5] whose rows are ''1 + 1/(-2)'' and ''2 + 1/(-2)''.'
  status: confirmed
  normative: true
  provenance: rat.text
  observations:
  - file: observations/rat_observations.json
    case_id: text-form
  - file: observations/rat_observations.json
    case_id: text-form-vector
numerical_edge_cases:
- id: rat.nonfinite-rule
  statement: Inf and -Inf gave N = 1 and -1 with D = 0; NaN gave N = 0, D = 0.
  status: confirmed
  normative: true
  provenance: rat.nonfinite
  observations:
  - file: observations/rat_observations.json
    case_id: inf
  - file: observations/rat_observations.json
    case_id: nan
- id: rat.complex-rule
  statement: 'Complex input did not error: [N, D] = rat(1 + 2i) gave N = 1+2i, D = 1, and the one-output
    form gave a 3x8 char matrix.'
  status: confirmed
  normative: false
  provenance: rat.complex
  observations:
  - file: observations/rat_observations.json
    case_id: complex-two-out
  - file: observations/rat_observations.json
    case_id: complex-text-form
warnings: []
errors:
- condition: X is char or an integer class.
  identifier: MATLAB:norm:inputType
  status: confirmed
  provenance: rat.error-char
  observations:
  - file: observations/rat_observations.json
    case_id: err-char
  - file: observations/rat_observations.json
    case_id: err-int
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/rat_observations.json
  description: 19 independently constructed cases on R2026a (GLNXA64), 2026-10-30.
provenance_ref: provenance.yaml
unresolved_questions:
- id: rat.q-warning-coverage
  question: Warnings were not captured except where a case reports a lastwarn identifier; an empty warnings
    list is not a complete statement.
- id: rat.q-error-ids
  question: The error identifier names another function (norm); whether an implementation must reproduce
    it is a human-review question (constitution 8.2).
- id: rat.q-default-tol
  question: The default tolerance was not determined; only its results for pi and 0.6667 were observed.
- id: rat.q-complex
  question: The complex results are recorded but not required; whether complex input should be supported
    is a human-review question.
