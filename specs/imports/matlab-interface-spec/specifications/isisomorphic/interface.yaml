# Interface specification for isisomorphic (widened 2026-10-29, Tier B W2; approved 2026-10-29 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: isisomorphic
spec_version: 0.3.0
status: approved
applicable_releases:
- R2026a
summary: Return whether two graphs (or two digraphs) are isomorphic.
invocation_forms:
- signature: tf = isisomorphic(G1, G2)
  description: True if G1 and G2 are isomorphic.
  status: confirmed
inputs:
- name: G1
  position: 1
  required: true
  description: graph or digraph object.
  status: confirmed
- name: G2
  position: 2
  required: true
  description: Object of the same class as G1.
  status: confirmed
outputs:
- name: tf
  description: Logical scalar.
  status: confirmed
output_type_rules:
- id: isisomorphic.output-class-rule
  statement: The output is a 1x1 logical for every non-erroring observed call.
  status: confirmed
  normative: true
  provenance: isisomorphic.output-class
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: identical
  - file: observations/isisomorphic_observations.json
    case_id: path-vs-star
output_shape_rules:
- id: isisomorphic.true-cases-rule
  statement: Returns true for identical graphs, relabelled graphs (undirected, directed, with a self-loop,
    and a multigraph), and two empty graphs.
  status: confirmed
  normative: true
  provenance: isisomorphic.true-cases
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: identical
  - file: observations/isisomorphic_observations.json
    case_id: relabelled
  - file: observations/isisomorphic_observations.json
    case_id: directed-relabelled
  - file: observations/isisomorphic_observations.json
    case_id: self-loop
  - file: observations/isisomorphic_observations.json
    case_id: multigraph-relabelled
  - file: observations/isisomorphic_observations.json
    case_id: empty
- id: isisomorphic.false-cases-rule
  statement: 'Returns false when the structures differ: path vs star with equal node and edge counts;
    different node counts (including isolated nodes, and a self-loop graph vs a larger path); different
    edge counts; a self-loop vs a parallel edge with equal node and edge counts; a multigraph vs a simple
    graph with equal counts.'
  status: confirmed
  normative: true
  provenance: isisomorphic.false-cases
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: path-vs-star
  - file: observations/isisomorphic_observations.json
    case_id: node-count
  - file: observations/isisomorphic_observations.json
    case_id: isolated
  - file: observations/isisomorphic_observations.json
    case_id: self-loop-vs-none
  - file: observations/isisomorphic_observations.json
    case_id: edge-count
  - file: observations/isisomorphic_observations.json
    case_id: self-loop-vs-parallel
  - file: observations/isisomorphic_observations.json
    case_id: multigraph
- id: isisomorphic.no-warning-rule
  statement: An ordinary call issued no warning.
  status: confirmed
  normative: true
  provenance: isisomorphic.no-warning
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: warn-call
- id: isisomorphic.direction-rule
  statement: 'For digraphs, edge direction matters: chains 1->2->3 and 1->2<-3 are not isomorphic.'
  status: confirmed
  normative: true
  provenance: isisomorphic.direction
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: directed-different
- id: isisomorphic.weights-ignored-rule
  statement: 'Edge weights are not compared by default: one edge of weight 5 vs one of weight 7 gave true.'
  status: confirmed
  normative: true
  provenance: isisomorphic.weights-ignored
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: weights-ignored
numerical_edge_cases: []
warnings: []
errors:
- condition: One input is a graph and the other a digraph.
  identifier: MATLAB:graphfun:isomorphism:ClassMismatch
  status: confirmed
  provenance: isisomorphic.error-mixed
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: err-mixed
- condition: The inputs are numeric matrices rather than graph objects.
  identifier: MATLAB:UndefinedFunction
  status: confirmed
  provenance: isisomorphic.error-matrix
  observations:
  - file: observations/isisomorphic_observations.json
    case_id: err-matrix
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/isisomorphic_observations.json
  description: 18 independently constructed cases on R2026a (GLNXA64), 2026-10-29.
provenance_ref: provenance.yaml
unresolved_questions:
- id: isisomorphic.q-warning-coverage
  question: Warnings were captured only in the warn-* cases; other cases (including error and edge cases)
    were not checked for warnings, so an empty warnings list is not a complete statement.
- id: isisomorphic.q-options
  question: Name-value options for comparing node or edge variables were not exercised.
- id: isisomorphic.q-second-output
  question: A second output (a node permutation) was not exercised.
