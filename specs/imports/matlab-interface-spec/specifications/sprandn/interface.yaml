# Interface specification for sprandn (created 2026-10-30, batch N5, new spec; approved 2026-10-30 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: sprandn
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Return a random sparse double matrix of a given size with nonzeros of both signs, up to a given
  density, or with the sparsity pattern of a given matrix.
invocation_forms:
- signature: R = sprandn(m, n, density)
  description: Random m-by-n sparse matrix (COBRA form).
  status: confirmed
- signature: R = sprandn(S)
  description: Same pattern as S, random values.
  status: confirmed
- signature: R = sprandn(m, n, density, rc)
  description: Four-argument form with a reciprocal condition number.
  status: confirmed
inputs:
- name: m
  position: 1
  required: true
  description: Number of rows (nonnegative integer).
  status: confirmed
- name: n
  position: 2
  required: true
  description: Number of columns.
  status: confirmed
- name: density
  position: 3
  required: true
  description: Target fraction of nonzeros.
  status: confirmed
- name: rc
  position: 4
  required: false
  description: Reciprocal condition number.
  status: confirmed
outputs:
- name: R
  description: Sparse real double matrix.
  status: confirmed
output_type_rules: []
output_shape_rules:
- id: sprandn.structure-rule
  statement: The result is a real, sparse double of size m-by-n with finite nonzeros of both signs; with
    the same rng seed the result is identical.
  status: confirmed
  normative: true
  provenance: sprandn.structure
  observations:
  - file: observations/sprandn_observations.json
    case_id: cobra-5x6
  - file: observations/sprandn_observations.json
    case_id: cobra-30x30
  - file: observations/sprandn_observations.json
    case_id: density-one
- id: sprandn.nnz-bound-rule
  statement: The nonzero count did not exceed density*m*n in the observed cases (14 for 5x6 at 0.6; 229
    for 30x30 at 0.3; 11 for 4x5 at density 1).
  status: confirmed
  normative: true
  provenance: sprandn.nnz-bound
  observations:
  - file: observations/sprandn_observations.json
    case_id: cobra-5x6
  - file: observations/sprandn_observations.json
    case_id: cobra-30x30
  - file: observations/sprandn_observations.json
    case_id: density-one
- id: sprandn.zero-density-rule
  statement: Density 0 gave an all-zero sparse matrix, and a zero-row size gave an empty sparse 0x3.
  status: confirmed
  normative: true
  provenance: sprandn.zero-density
  observations:
  - file: observations/sprandn_observations.json
    case_id: density-zero
  - file: observations/sprandn_observations.json
    case_id: empty-dims
- id: sprandn.pattern-rule
  statement: sprandn(S) returned a sparse matrix of the size of S with exactly its nonzero pattern.
  status: confirmed
  normative: true
  provenance: sprandn.pattern
  observations:
  - file: observations/sprandn_observations.json
    case_id: pattern
- id: sprandn.rc-rule
  statement: sprandn(4, 4, 0.5, 0.1) returned a 4x4 sparse double whose 2-norm condition number was 10.
  status: confirmed
  normative: true
  provenance: sprandn.rc
  observations:
  - file: observations/sprandn_observations.json
    case_id: rc
numerical_edge_cases:
- id: sprandn.density-out-of-range-rule
  statement: 'Out-of-range densities did not error: 1.5 gave a 3x3 sparse matrix with 7 nonzeros, and
    -0.1 an all-zero 3x3 sparse matrix.'
  status: confirmed
  normative: false
  provenance: sprandn.density-out-of-range
  observations:
  - file: observations/sprandn_observations.json
    case_id: density-above-one
  - file: observations/sprandn_observations.json
    case_id: density-negative
- id: sprandn.values-rule
  statement: 'Inference (not observed): the nonzero values and their positions depend on the random generator.'
  status: unresolved
  normative: false
  provenance: sprandn.values
  observations:
  - file: observations/sprandn_observations.json
    case_id: cobra-5x6
warnings: []
errors:
- condition: m is not an integer.
  identifier: MATLAB:RandStream:randi:invalidLimits
  status: confirmed
  provenance: sprandn.error-noninteger
  observations:
  - file: observations/sprandn_observations.json
    case_id: err-noninteger
- condition: Only m and n are given.
  identifier: MATLAB:sprandn:TwoInputs
  status: confirmed
  provenance: sprandn.error-two-args
  observations:
  - file: observations/sprandn_observations.json
    case_id: err-two-args
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/sprandn_observations.json
  description: 11 independently constructed cases on R2026a (GLNXA64), 2026-10-30.
provenance_ref: provenance.yaml
unresolved_questions:
- id: sprandn.q-warning-coverage
  question: Warnings were not captured except where a case reports a lastwarn identifier; an empty warnings
    list is not a complete statement.
- id: sprandn.q-error-ids
  question: The non-integer identifier names another component (RandStream/randi); whether an implementation
    must reproduce it is a human-review question (constitution 8.2).
- id: sprandn.q-values
  question: Whether implementations must match the oracle values for a given seed, or only the observed
    structure, class and repeatability, is a human-review question (constitution 8.2).
- id: sprandn.q-density
  question: The exact relation between density and the nonzero count was not determined; only upper bounds
    were observed.
