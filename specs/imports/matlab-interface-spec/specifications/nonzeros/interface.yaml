# Interface specification for nonzeros (promoted; observed behaviour confirmed).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: nonzeros
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: 'Return the nonzero elements of the input as a column vector, in column-major order.

  '
invocation_forms:
- signature: v = nonzeros(A)
  description: Nonzero elements of A as a column vector.
  status: confirmed
inputs:
- name: A
  required: true
  description: Numeric array (full or sparse).
  status: pending
outputs:
- name: v
  description: Column vector of nonzero values.
  status: pending
  type_rule:
    id: nonzeros.out-type
    statement: The first output has class double (observed).
    status: confirmed
    normative: true
    provenance: nonzeros.output-class
    observations:
    - file: observations/nonzeros_observations.json
      case_id: row
    - file: observations/nonzeros_observations.json
      case_id: matrix
    - file: observations/nonzeros_observations.json
      case_id: col-major
    - file: observations/nonzeros_observations.json
      case_id: sparse
output_type_rules:
- id: nonzeros.output-class-rule
  statement: The output class is double across the observed inputs.
  status: confirmed
  normative: true
  provenance: nonzeros.output-class
  observations:
  - file: observations/nonzeros_observations.json
    case_id: row
  - file: observations/nonzeros_observations.json
    case_id: matrix
  - file: observations/nonzeros_observations.json
    case_id: col-major
  - file: observations/nonzeros_observations.json
    case_id: sparse
output_shape_rules:
- id: nonzeros.column-major-order-rule
  statement: 'Returns the nonzero elements as a column vector in column-major order: nonzeros([1 2; 3
    0]) gave [1;3;2] (column-major traversal 1,3,2,0; row-major would give [1;2;3]), which distinguishes
    the two orderings. Works for full and sparse inputs.'
  status: confirmed
  normative: true
  provenance: nonzeros.column-major-order
  observations:
  - file: observations/nonzeros_observations.json
    case_id: row
  - file: observations/nonzeros_observations.json
    case_id: matrix
  - file: observations/nonzeros_observations.json
    case_id: col-major
  - file: observations/nonzeros_observations.json
    case_id: sparse
numerical_edge_cases: []
warnings: []
errors: []
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/nonzeros_observations.json
  description: 4 independently constructed cases on R2026a (GLNXA64).
