# Interface specification for saveas (promoted; observed behaviour confirmed).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: saveas
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: 'Save a figure or graphics object to a file in a specified format.

  '
invocation_forms:
- signature: saveas(fig, filename)
  description: Save fig to filename (format inferred from extension).
  status: confirmed
- signature: saveas(fig, filename, formattype)
  description: Save with an explicit format.
  status: pending
inputs:
- name: fig
  required: true
  description: Figure or graphics object.
  status: pending
- name: filename
  required: true
  description: Output file name.
  status: pending
- name: formattype
  required: false
  description: Optional explicit format.
  status: pending
outputs:
- name: (none)
  description: No output argument; the effect is a written file.
  status: pending
output_type_rules: []
output_shape_rules:
- id: saveas.creates-file-rule
  statement: Saving a graphics object creates the target file (isfile is true) with a nonzero byte size
    (an off-screen line plot produced a PNG of about 12 kB). saveas returns no output; the effect is the
    written file.
  status: confirmed
  normative: true
  provenance: saveas.creates-file
  observations:
  - file: observations/saveas_observations.json
    case_id: file-created
  - file: observations/saveas_observations.json
    case_id: file-nonempty
numerical_edge_cases: []
warnings: []
errors: []
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/saveas_observations.json
  description: 2 independently constructed cases on R2026a (GLNXA64).
provenance_ref: provenance.yaml
unresolved_questions:
- id: saveas.q-side-effect
  question: saveas requires a graphics object and writes a file; experiments must create a figure, target
    a temporary path, verify, and clean up.
- id: saveas.q-formats
  question: Enumerate supported format types and extension inference.
