  identifier: MATLAB:maxrhs
  status: confirmed
  provenance: isunix.error-arg
  observations:
  - file: observations/isunix_observations.json
    case_id: err-arg
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
