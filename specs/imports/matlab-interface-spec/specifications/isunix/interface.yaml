  status: confirmed
output_type_rules: []
output_shape_rules:
- id: isunix.value-rule
  statement: On the GLNXA64 oracle isunix returned logical true, while ispc and ismac returned false.
  status: confirmed
  normative: true
  provenance: isunix.value
  observations:
  - file: observations/isunix_observations.json
    case_id: value
  - file: observations/isunix_observations.json
    case_id: consistency
- id: isunix.cobra-test-rule
  statement: The COBRA test `isunix && ~ismac` was true on the GLNXA64 oracle.
  status: confirmed
  normative: true
  provenance: isunix.cobra-test
  observations:
  - file: observations/isunix_observations.json
    case_id: cobra-linux-test
numerical_edge_cases: []
warnings: []
errors:
