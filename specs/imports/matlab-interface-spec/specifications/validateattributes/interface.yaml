unresolved_questions:
- id: validateattributes.q-check-order
  question: When several attributes fail at once, which identifier is reported was not exercised.
- id: validateattributes.q-more-attributes
  question: Attributes not exercised here (e.g. 'nonnegative' on non-numeric classes, 'diag', 'decreasing'
    pass cases, 'scalartext'/text attributes) remain unspecified.
