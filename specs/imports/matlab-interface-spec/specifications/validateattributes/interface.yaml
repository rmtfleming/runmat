# Interface specification for validateattributes (widened 2026-10-29, Tier B W2; approved 2026-10-29 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: validateattributes
spec_version: 0.3.0
status: approved
applicable_releases:
- R2026a
summary: Check that an input has one of the listed classes and satisfies every listed attribute; error
  if not, return nothing if so.
invocation_forms:
- signature: validateattributes(A, classes, attributes)
  description: Validate A against a class list and an attribute list.
  status: confirmed
- signature: validateattributes(A, classes, attributes, funcName, varName)
  description: As above, with funcName (used in the error identifier) and varName (accepted).
  status: confirmed
- signature: validateattributes(A, classes, attributes, funcName, varName, argIndex)
  description: As above, with argIndex (accepted).
  status: confirmed
inputs:
- name: A
  position: 1
  required: true
  description: Value to validate.
  status: confirmed
- name: classes
  position: 2
  required: true
  description: Cell array of class names; A must match one.
  status: confirmed
- name: attributes
  position: 3
  required: true
  description: Cell array of attribute names, some followed by a value ('>', '>=', '<', '<=', 'numel',
    'size', 'ncols', 'nrows', 'ndims').
  status: confirmed
- name: funcName
  position: 4
  required: false
  description: Function name; changes the error identifier's middle component.
  status: confirmed
- name: varName
  position: 5
  required: false
  description: Variable name; accepted (its effect on the error message was not recorded).
  status: confirmed
- name: argIndex
  position: 6
  required: false
  description: Argument position; accepted (its effect on the error message was not recorded).
  status: confirmed
outputs: []
output_type_rules: []
output_shape_rules:
- id: validateattributes.pass-silent-rule
  statement: When A satisfies the classes and attributes, the call returns without error and without a
    warning.
  status: confirmed
  normative: true
  provenance: validateattributes.pass-silent
  observations:
  - file: observations/validateattributes_observations.json
    case_id: pass
  - file: observations/validateattributes_observations.json
    case_id: pass-empty-attrs
  - file: observations/validateattributes_observations.json
    case_id: pass-row
  - file: observations/validateattributes_observations.json
    case_id: pass-positive
  - file: observations/validateattributes_observations.json
    case_id: pass-gt
  - file: observations/validateattributes_observations.json
    case_id: pass-size-nan
  - file: observations/validateattributes_observations.json
    case_id: pass-extra-args
- id: validateattributes.class-list-rule
  statement: 'A passes the class check if its class matches any listed class: single matched {''double'',''single''};
    char, logical, cell, struct and function_handle matched their own class names.'
  status: confirmed
  normative: true
  provenance: validateattributes.class-list
  observations:
  - file: observations/validateattributes_observations.json
    case_id: pass-class-list
  - file: observations/validateattributes_observations.json
    case_id: pass-class-char
  - file: observations/validateattributes_observations.json
    case_id: pass-class-logical
  - file: observations/validateattributes_observations.json
    case_id: pass-class-cell
  - file: observations/validateattributes_observations.json
    case_id: pass-class-struct
  - file: observations/validateattributes_observations.json
    case_id: pass-class-fh
- id: validateattributes.empty-attributes-rule
  statement: An empty attribute list imposes no attribute checks.
  status: confirmed
  normative: true
  provenance: validateattributes.empty-attributes
  observations:
  - file: observations/validateattributes_observations.json
    case_id: pass-empty-attrs
- id: validateattributes.attribute-semantics-rule
  statement: '''integer'' accepts integer-valued doubles; ''nonnegative'' accepts zero; ''nondecreasing''
    accepts repeated values while ''increasing'' does not; ''>'' is strict and ''>='' inclusive; NaN in
    a ''size'' vector matches any extent.'
  status: confirmed
  normative: true
  provenance: validateattributes.attribute-semantics
  observations:
  - file: observations/validateattributes_observations.json
    case_id: pass-integer-double
  - file: observations/validateattributes_observations.json
    case_id: pass-nonnegative
  - file: observations/validateattributes_observations.json
    case_id: pass-nondecreasing
  - file: observations/validateattributes_observations.json
    case_id: fail-increasing
  - file: observations/validateattributes_observations.json
    case_id: fail-gt
  - file: observations/validateattributes_observations.json
    case_id: pass-ge
  - file: observations/validateattributes_observations.json
    case_id: pass-size-nan
- id: validateattributes.each-attribute-checked-rule
  statement: 'Every listed attribute is enforced: with {''scalar'',''positive''}, [1 2] failed on ''scalar''
    and -1 failed on ''positive''.'
  status: confirmed
  normative: true
  provenance: validateattributes.each-attribute-checked
  observations:
  - file: observations/validateattributes_observations.json
    case_id: fail-first-of-two
  - file: observations/validateattributes_observations.json
    case_id: fail-second-of-two
- id: validateattributes.funcname-identifier-rule
  statement: With funcName given, the error identifier has funcName as its middle component (MATLAB:myfun:expectedScalar,
    MATLAB:myfun:invalidType).
  status: confirmed
  normative: true
  provenance: validateattributes.funcname-identifier
  observations:
  - file: observations/validateattributes_observations.json
    case_id: fail-extra-args
  - file: observations/validateattributes_observations.json
    case_id: fail-extra-varname
numerical_edge_cases: []
warnings:
