# Interface specification for dec2base (created 2026-10-29, batch N1, new spec; approved 2026-10-29 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: dec2base
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Convert non-negative integers to text in a given base (2-36), using digits 0-9 then upper-case
  letters.
invocation_forms:
- signature: str = dec2base(d, base)
  description: Text representation of d in base `base`.
  status: confirmed
- signature: str = dec2base(d, base, n)
  description: With at least n digits.
  status: confirmed
inputs:
- name: d
  position: 1
  required: true
  description: Non-negative integer value(s), double or integer class.
  status: confirmed
- name: base
  position: 2
  required: true
  description: Integer from 2 to 36.
  status: confirmed
- name: n
  position: 3
  required: false
  description: Minimum number of digits.
  status: confirmed
outputs:
- name: str
  description: Char array with one row per element of d.
  status: confirmed
output_type_rules:
- id: dec2base.output-class-rule
  statement: The output is a char array.
  status: confirmed
  normative: true
  provenance: dec2base.output-class
  observations:
  - file: observations/dec2base_observations.json
    case_id: base2
  - file: observations/dec2base_observations.json
    case_id: vector
output_shape_rules:
- id: dec2base.digits-rule
  statement: 'Digits above 9 are upper-case letters: 23 in base 2 gave ''10111'', in base 3 ''212''; 255
    in base 16 gave ''FF''; 200 in base 16 gave ''C8''; 35 in base 36 gave ''Z''.'
  status: confirmed
  normative: true
  provenance: dec2base.digits
  observations:
  - file: observations/dec2base_observations.json
    case_id: base2
  - file: observations/dec2base_observations.json
    case_id: base3
  - file: observations/dec2base_observations.json
    case_id: base16
  - file: observations/dec2base_observations.json
    case_id: uint8
  - file: observations/dec2base_observations.json
    case_id: base36-z
- id: dec2base.zero-rule
  statement: 0 gives '0'.
  status: confirmed
  normative: true
  provenance: dec2base.zero
  observations:
  - file: observations/dec2base_observations.json
    case_id: zero
- id: dec2base.padding-rule
  statement: n pads with leading zeros to at least n digits ('00000101'); n smaller than needed does not
    truncate ('11111111').
  status: confirmed
  normative: true
  provenance: dec2base.padding
  observations:
  - file: observations/dec2base_observations.json
    case_id: pad
  - file: observations/dec2base_observations.json
    case_id: pad-short
- id: dec2base.vector-rule
  statement: Several values give one row per element, padded with leading zeros to a common width, for
    both a column vector ([1;10;100] in base 10 gave ['001';'010';'100']) and a row vector ([1 2 3] in
    base 2 gave ['01';'10';'11']).
  status: confirmed
  normative: true
  provenance: dec2base.vector
  observations:
  - file: observations/dec2base_observations.json
    case_id: vector
  - file: observations/dec2base_observations.json
    case_id: row-vector
  - file: observations/dec2base_observations.json
    case_id: base36
- id: dec2base.integer-class-rule
  statement: Integer-class input is accepted (uint8(200) in base 16 gave 'C8').
  status: confirmed
  normative: true
  provenance: dec2base.integer-class
  observations:
  - file: observations/dec2base_observations.json
    case_id: uint8
- id: dec2base.large-rule
  statement: The double 2^52 in base 16 gave '10000000000000'.
  status: confirmed
  normative: true
  provenance: dec2base.large
  observations:
  - file: observations/dec2base_observations.json
    case_id: large
numerical_edge_cases: []
warnings: []
errors:
- condition: d is negative or not an integer.
  identifier: MATLAB:dec2base:FirstArg
  status: confirmed
  provenance: dec2base.error-negative
  observations:
  - file: observations/dec2base_observations.json
    case_id: err-negative
  - file: observations/dec2base_observations.json
    case_id: err-fraction
- condition: base is 1 or 37 (outside 2-36), or the two-character char array 'ab'.
  identifier: MATLAB:dec2base:SecondArg
  status: confirmed
  provenance: dec2base.error-base1
  observations:
  - file: observations/dec2base_observations.json
    case_id: err-base1
  - file: observations/dec2base_observations.json
    case_id: err-base37
  - file: observations/dec2base_observations.json
    case_id: err-symbols
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/dec2base_observations.json
  description: 17 independently constructed cases on R2026a (GLNXA64), 2026-10-29.
provenance_ref: provenance.yaml
unresolved_questions:
- id: dec2base.q-warning-coverage
  question: Warnings were not captured by this harness; an empty warnings list is not a complete statement.
- id: dec2base.q-large-values
  question: Values beyond 2^52 were not exercised.
- id: dec2base.q-char-base
  question: 'Flagged for human review (constitution 8.2): char values for the base argument were observed
    only as the rejected ''ab''; other char forms were not exercised.'
