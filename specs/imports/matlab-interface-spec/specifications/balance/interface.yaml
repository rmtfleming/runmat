# Interface specification for balance (created 2026-10-29, batch N1, new spec; approved 2026-10-29 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: balance
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: Balance a square matrix by a diagonal (power-of-two) similarity scaling, possibly with a permutation,
  to improve eigenvalue accuracy.
invocation_forms:
- signature: B = balance(A)
  description: Balanced matrix.
  status: confirmed
- signature: '[T, B] = balance(A)'
  description: Transformation T with B = T\A*T.
  status: confirmed
- signature: '[S, P, B] = balance(A)'
  description: Scaling vector S and permutation vector P.
  status: confirmed
- signature: ___ = balance(A, 'noperm')
  description: Scale without permuting.
  status: confirmed
inputs:
- name: A
  position: 1
  required: true
  description: Full square matrix (double or single).
  status: confirmed
- name: opt
  position: 2
  required: false
  description: '''noperm''.'
  status: confirmed
outputs:
- name: B
  description: Balanced matrix.
  status: confirmed
- name: T
  description: Transformation matrix.
  status: confirmed
- name: S
  description: Scaling vector.
  status: confirmed
- name: P
  description: Permutation vector.
  status: confirmed
output_type_rules:
- id: balance.output-class-rule
  statement: The output keeps the input class (double for double; single for single).
  status: confirmed
  normative: true
  provenance: balance.output-class
  observations:
  - file: observations/balance_observations.json
    case_id: single-output
  - file: observations/balance_observations.json
    case_id: single-class
output_shape_rules:
- id: balance.similarity-rule
  statement: '[T, B] = balance(A) satisfies T\A*T = B within 1e-12 (residual 0 observed for both matrices
    tried) and preserves the eigenvalues (difference within 1e-10).'
  status: confirmed
  normative: true
  provenance: balance.similarity
  observations:
  - file: observations/balance_observations.json
    case_id: two-outputs
  - file: observations/balance_observations.json
    case_id: permutation
  - file: observations/balance_observations.json
    case_id: eig-preserved
- id: balance.power-of-two-rule
  statement: For the observed badly scaled matrix (no permutation) T was diagonal with powers of two on
    its diagonal (2^9, 2^3, 2^-4).
  status: confirmed
  normative: true
  provenance: balance.power-of-two
  observations:
  - file: observations/balance_observations.json
    case_id: two-outputs
- id: balance.three-outputs-rule
  statement: '[S, P, B] returns a column scaling vector S (the diagonal of T) and a column permutation
    vector P ([1;2;3] when no permutation is applied).'
  status: confirmed
  normative: true
  provenance: balance.three-outputs
  observations:
  - file: observations/balance_observations.json
    case_id: three-outputs
  - file: observations/balance_observations.json
    case_id: two-outputs
- id: balance.already-balanced-rule
  statement: An already balanced matrix ([1 2; 3 4]) and a scalar are returned unchanged.
  status: confirmed
  normative: true
  provenance: balance.already-balanced
  observations:
  - file: observations/balance_observations.json
    case_id: balanced
  - file: observations/balance_observations.json
    case_id: scalar
- id: balance.noperm-rule
  statement: '''noperm'' gave the same B as the default for a matrix that needed no permutation.'
  status: confirmed
  normative: true
  provenance: balance.noperm
  observations:
  - file: observations/balance_observations.json
    case_id: noperm
  - file: observations/balance_observations.json
    case_id: single-output
numerical_edge_cases:
- id: balance.observed-values-rule
  statement: 'Recorded for reference: A = [1 100 10000; 0.01 1 100; 0.0001 0.01 1] gave B = [1 1.5625
    1.220703125; 0.64 1 0.78125; 0.8192 1.28 1] (within 1e-12); the lower-triangular [1 0 0; 2 3 0; 4
    5 6] gave T equal to the reversal permutation and B = [6 5 4; 0 3 2; 0 0 1].'
  status: confirmed
  normative: false
  provenance: balance.observed-values
  observations:
  - file: observations/balance_observations.json
    case_id: single-output
  - file: observations/balance_observations.json
    case_id: two-outputs
  - file: observations/balance_observations.json
    case_id: permutation
warnings: []
errors:
- condition: A is not square.
  identifier: MATLAB:square
  status: confirmed
  provenance: balance.error-nonsquare
  observations:
  - file: observations/balance_observations.json
    case_id: err-nonsquare
- condition: A is sparse.
  identifier: MATLAB:balance:noBalanceSparse
  status: confirmed
  provenance: balance.error-sparse
  observations:
  - file: observations/balance_observations.json
    case_id: err-sparse
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/balance_observations.json
  description: 11 independently constructed cases on R2026a (GLNXA64), 2026-10-29.
provenance_ref: provenance.yaml
unresolved_questions:
- id: balance.q-warning-coverage
  question: Warnings were not captured by this harness; an empty warnings list is not a complete statement.
- id: balance.q-exact-values
  question: 'Flagged for human review (constitution 8.2): whether conforming implementations must reproduce
    these exact balanced matrices (which depend on the balancing procedure) or only the similarity and
    scaling properties.'
- id: balance.q-noperm-permuting
  question: '''noperm'' on a matrix that would otherwise be permuted was not exercised.'
- id: balance.q-complex
  question: Complex input was not exercised.
