# Interface specification for isstruct (promoted; observed behaviour confirmed).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: isstruct
spec_version: 0.2.0
status: approved
applicable_releases:
- R2026a
summary: 'Return a logical scalar that is true when the input is a structure array and false otherwise.

  '
invocation_forms:
- signature: tf = isstruct(A)
  description: Test whether A is a struct.
  status: confirmed
inputs:
- name: A
  required: true
  description: Value to test.
  status: pending
outputs:
- name: tf
  description: Logical scalar result.
  status: pending
  type_rule:
    id: isstruct.out-type
    statement: The first output has class logical (observed).
    status: confirmed
    normative: true
    provenance: isstruct.output-class
    observations:
    - file: observations/isstruct_observations.json
      case_id: struct
    - file: observations/isstruct_observations.json
      case_id: struct-array
    - file: observations/isstruct_observations.json
      case_id: numeric
    - file: observations/isstruct_observations.json
      case_id: cell
output_type_rules:
- id: isstruct.output-class-rule
  statement: The output class is logical across the observed inputs.
  status: confirmed
  normative: true
  provenance: isstruct.output-class
  observations:
  - file: observations/isstruct_observations.json
    case_id: struct
  - file: observations/isstruct_observations.json
    case_id: struct-array
  - file: observations/isstruct_observations.json
    case_id: numeric
  - file: observations/isstruct_observations.json
    case_id: cell
- id: isstruct.logical-struct-test-rule
  statement: 'Returns a 1-by-1 logical: true for scalar structs and struct arrays, false for numeric and
    cell inputs.'
  status: confirmed
  normative: true
  provenance: isstruct.logical-struct-test
  observations:
  - file: observations/isstruct_observations.json
    case_id: struct
  - file: observations/isstruct_observations.json
    case_id: struct-array
  - file: observations/isstruct_observations.json
    case_id: numeric
  - file: observations/isstruct_observations.json
    case_id: cell
output_shape_rules: []
numerical_edge_cases: []
warnings: []
errors: []
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/isstruct_observations.json
  description: 4 independently constructed cases on R2026a (GLNXA64).
provenance_ref: provenance.yaml
unresolved_questions:
- id: isstruct.q-output
  question: Confirm output class (logical) and size (1x1).
