# Interface specification for incidence (widened 2026-10-29, Tier B W2; approved 2026-10-29 after human-loop review).
# Schema: ../../schemas/function-interface.schema.json
schema_version: '1.0'
function_name: incidence
spec_version: 0.3.0
status: approved
applicable_releases:
- R2026a
summary: Return the sparse node-by-edge incidence matrix of a graph or digraph.
invocation_forms:
- signature: I = incidence(G)
  description: Incidence matrix of graph or digraph G.
  status: confirmed
inputs:
- name: G
  position: 1
  required: true
  description: A graph or digraph object without self-loops.
  status: confirmed
outputs:
- name: I
  description: Sparse double matrix, number of nodes by number of edges.
  status: confirmed
output_type_rules:
- id: incidence.output-class-rule
  statement: The output is a sparse double matrix, for both graph and digraph input.
  status: confirmed
  normative: true
  provenance: incidence.output-class
  observations:
  - file: observations/incidence_observations.json
    case_id: sparse-class
  - file: observations/incidence_observations.json
    case_id: directed-sparse-class
  - file: observations/incidence_observations.json
    case_id: empty-graph
  - file: observations/incidence_observations.json
    case_id: nodes-no-edges
output_shape_rules:
- id: incidence.shape-rule
  statement: The matrix has one row per node and one column per edge, isolated nodes included (graph(1,2,1,4)
    gave 4x1; three nodes with no edges gave 3x0; the empty graph gave 0x0).
  status: confirmed
  normative: true
  provenance: incidence.shape
  observations:
  - file: observations/incidence_observations.json
    case_id: sparse-class
  - file: observations/incidence_observations.json
    case_id: isolated-node
  - file: observations/incidence_observations.json
    case_id: nodes-no-edges
  - file: observations/incidence_observations.json
    case_id: empty-graph
- id: incidence.signs-rule
  statement: 'Each column holds -1 in the row of the edge''s first end node and +1 in the row of its second
    end node, for both graph and digraph: digraph edge 3->1 gave +1 at node 1 and -1 at node 3; graph(3,1)
    stored its edge as EndNodes [1 3] and gave -1 at node 1 and +1 at node 3.'
  status: confirmed
  normative: true
  provenance: incidence.signs
  observations:
  - file: observations/incidence_observations.json
    case_id: basic
  - file: observations/incidence_observations.json
    case_id: directed
  - file: observations/incidence_observations.json
    case_id: directed-reverse
  - file: observations/incidence_observations.json
    case_id: undirected-reversed-input
  - file: observations/incidence_observations.json
    case_id: reversed-input-table
- id: incidence.no-warning-rule
  statement: An ordinary call issued no warning.
  status: confirmed
  normative: true
  provenance: incidence.no-warning
  observations:
  - file: observations/incidence_observations.json
    case_id: warn-call
- id: incidence.edge-order-rule
  statement: 'Columns follow the graph''s stored edge order (G.Edges.EndNodes): graph([2 1],[3 2]) stored
    [1 2; 2 3] and digraph([3 1],[1 2]) stored [1 2; 3 1], and the columns matched those orders.'
  status: confirmed
  normative: true
  provenance: incidence.edge-order
  observations:
  - file: observations/incidence_observations.json
    case_id: edge-order
  - file: observations/incidence_observations.json
    case_id: edge-order-table
  - file: observations/incidence_observations.json
    case_id: directed-edge-order
  - file: observations/incidence_observations.json
    case_id: directed-edge-order-table
- id: incidence.multigraph-rule
  statement: Parallel edges each get their own column (two edges 1-2 gave two identical columns).
  status: confirmed
  normative: true
  provenance: incidence.multigraph
  observations:
  - file: observations/incidence_observations.json
    case_id: multigraph
- id: incidence.weights-ignored-rule
  statement: Edge weights do not affect the entries, which stay -1 and +1.
  status: confirmed
  normative: true
  provenance: incidence.weights-ignored
  observations:
  - file: observations/incidence_observations.json
    case_id: weighted
numerical_edge_cases: []
warnings: []
errors:
- condition: The graph or digraph contains a self-loop.
  identifier: MATLAB:graphfun:incidence:SelfLoops
  status: confirmed
  provenance: incidence.error-self-loop-graph
  observations:
  - file: observations/incidence_observations.json
    case_id: self-loop-graph
  - file: observations/incidence_observations.json
    case_id: self-loop-digraph
- condition: The input is a numeric matrix rather than a graph object.
  identifier: MATLAB:UndefinedFunction
  status: confirmed
  provenance: incidence.error-matrix
  observations:
  - file: observations/incidence_observations.json
    case_id: err-matrix
nan_infinity_behaviour: []
release_dependent_behaviour: []
linked_observations:
- file: observations/incidence_observations.json
  description: 20 independently constructed cases on R2026a (GLNXA64), 2026-10-29.
provenance_ref: provenance.yaml
unresolved_questions:
- id: incidence.q-warning-coverage
  question: Warnings were captured only in the warn-* cases; other cases (including error and edge cases)
    were not checked for warnings, so an empty warnings list is not a complete statement.
- id: incidence.q-named-nodes
  question: Graphs with named nodes or extra edge variables were not exercised.
